<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Omes a Show</title>
<link rel="stylesheet" href="hub.css">
</head>
<body>
<div id="stage">
  <header>
    <div id="time-block">
      <div id="clock"></div>
      <div id="date"></div>
    </div>
    <div id="controls">
      <div class="control" id="sleep-btn"></div>
      <div class="control" id="off-btn">Turn off TV</div>
    </div>
  </header>
  <main id="viewport">
    <div id="grid"></div>
    <div id="empty"></div>
  </main>
  <div id="toast"></div>
</div>
<script src="hub.js"></script>
</body>
</html>
